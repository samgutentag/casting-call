<!DOCTYPE html>
<!--
  Index across every day processed. Written to the target directory's index.html.
  Placeholders are {{LIKE_THIS}} and REPEAT comments show what to clone.
  Delete every comment in the rendered output.
  NOTE: never nest a comment inside this one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Reports</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e2e2df;
    --card: #ffffff; --accent: #2a5db0; --chip: #eef1f6;
    --mine: #b2741a; --theirs: #2f6f4f; --ask: #6b4fa8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e8e6; --muted: #9a9a97; --line: #2c2e33;
      --card: #1e2024; --accent: #7aa2e3; --chip: #24262b;
      --mine: #d9a45c; --theirs: #6fb392; --ask: #a48ad4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem; background: var(--bg); color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  [id] { scroll-margin-top: 1.5rem; }

  /* Side nav. Fixed to the left of the centered column on a wide window, and
     dropped entirely when there is no room for it rather than crowding the text. */
  .toc {
    position: fixed; top: 2rem; left: max(1rem, calc(50% - 640px)); width: 210px;
    font-size: .85rem; line-height: 1.35; max-height: calc(100vh - 4rem);
    overflow-y: auto;
  }
  .toc h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted); margin: 0 0 .5rem; }
  .toc a { display: block; padding: .25rem .5rem; color: var(--muted);
           text-decoration: none; border-left: 2px solid var(--line);
           border-radius: 0 4px 4px 0; }
  .toc a:hover { color: var(--fg); background: var(--chip); }
  .toc a.on { color: var(--accent); border-left-color: var(--accent); background: var(--chip); }
  .toc .sub { padding-left: 1.1rem; }
  @media (max-width: 1180px) { .toc { display: none; } }
  @media print { .toc { display: none; } }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .date { color: var(--muted); margin: 0 0 1rem; }
  .summary { font-size: 1.05rem; margin: 0 0 1.5rem; }
  audio { width: 100%; margin: 0 0 1.5rem; }

  /* ---- roll-up: what you act on without re-reading the call ---- */
  .rollup { border: 1px solid var(--line); border-radius: 10px; background: var(--card);
            padding: 1rem 1.1rem; margin: 0 0 2rem; }
  .rollup h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
               color: var(--muted); margin: 0 0 .6rem; }
  .rollup h2:not(:first-child) { margin-top: 1.1rem; }
  .rollup ul { margin: 0; padding: 0; list-style: none; }
  .rollup li { padding: .3rem 0; display: flex; gap: .7rem; align-items: baseline; }
  .rollup li .ts { margin-left: 0; flex: 0 0 auto; width: 4.6rem; text-align: center; }
  .rollup .none { color: var(--muted); font-style: italic; padding: .3rem 0; }
  .bar-mine   { border-left: 3px solid var(--mine); padding-left: .7rem; }
  .bar-theirs { border-left: 3px solid var(--theirs); padding-left: .7rem; }
  .bar-ask    { border-left: 3px solid var(--ask); padding-left: .7rem; }

  /* ---- topic sections: the spine of the page ---- */
  .section { margin: 0 0 1.75rem; }
  .section > h2 {
    font-size: 1.15rem; margin: 0 0 .1rem;
    display: flex; align-items: baseline; gap: .6rem;
  }
  .section .span { color: var(--muted); font-size: .85rem; font-weight: 400;
                   font-variant-numeric: tabular-nums; margin-left: auto; }
  .section > .lede { color: var(--muted); margin: 0 0 .8rem; font-size: .95rem; }

  .item { border: 1px solid var(--line); border-radius: 10px; background: var(--card);
          padding: .7rem .9rem; margin: 0 0 .6rem; }
  .item .head { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .35rem; }
  .kind { font-size: .7rem; font-weight: 700; text-transform: uppercase;
          letter-spacing: .04em; padding: .1rem .45rem; border-radius: 4px;
          background: var(--chip); border: 1px solid var(--line); color: var(--muted); }
  .kind.mine   { color: var(--mine); border-color: var(--mine); }
  .kind.theirs { color: var(--theirs); border-color: var(--theirs); }
  .kind.ask    { color: var(--ask); border-color: var(--ask); }
  .spoken { margin-left: .3rem; color: var(--muted); font-size: .72rem; }
  a:not(.card) { color: var(--accent); }
  a.ts { text-decoration: none; }
  .ts {
    font: inherit; font-size: .85rem; font-variant-numeric: tabular-nums; cursor: pointer;
    background: var(--chip); border: 1px solid var(--line); color: var(--accent);
    border-radius: 6px; padding: .05rem .45rem; margin-left: auto;
  }
  .ts:hover { border-color: var(--accent); }
  .ts[disabled] { cursor: default; color: var(--muted); }
  .oneliner { margin: 0 0 .5rem; }
  .ev { margin: .1rem 0 0; }
  .ev > summary {
    cursor: pointer; list-style: none; display: inline-flex; align-items: center;
    gap: .3rem; font-size: .78rem; color: var(--muted); padding: .1rem 0;
  }
  .ev > summary::-webkit-details-marker { display: none; }
  .ev > summary::before { content: "▸"; font-size: .7rem; }
  .ev[open] > summary::before { content: "▾"; }
  .ev > summary:hover { color: var(--accent); }
  .ev > *:not(summary) { margin-top: .4rem; }
  .quotes { margin: 0; padding: .45rem .7rem; border-left: 3px solid var(--line);
            color: var(--muted); font-size: .9rem; }
  .quotes .who { font-weight: 600; color: var(--fg); }
  .shot { margin: .6rem 0 0; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; }
  .noshot { color: var(--muted); font-style: italic; font-size: .9rem; margin: .5rem 0 0; }

  .rollup .decisions { margin-top: 1.1rem; }
  .rollup .decisions ul { list-style: none; }
  .rollup .decisions li { padding: .3rem 0 .3rem .7rem;
                          border-left: 3px solid var(--line); margin: 0 0 .4rem; }
</style>

<style>
  /* Day and index pages: a list of cards, each linking one level down. */
  .card {
    display: block; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); padding: .85rem 1rem; margin: 0 0 .6rem;
    text-decoration: none; color: inherit;
  }
  a.card:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: baseline; gap: .6rem; margin: 0 0 .25rem; }
  .card .name { font-weight: 600; }
  .card .when { margin-left: auto; color: var(--muted); font-size: .85rem;
                font-variant-numeric: tabular-nums; }
  .card .blurb { color: var(--muted); font-size: .93rem; margin: 0; }
  .tally { display: flex; flex-wrap: wrap; gap: .35rem; margin: .45rem 0 0;
           padding: 0; list-style: none; }
  .tally li { background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
              padding: .1rem .6rem; font-size: .78rem; color: var(--muted); }
  .tally li.mine { color: var(--mine); border-color: var(--mine); }
  .tally li.theirs { color: var(--theirs); border-color: var(--theirs); }
  .tally li.ask { color: var(--ask); border-color: var(--ask); }
  .rollup li .from { color: var(--muted); font-size: .8rem; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>Call Reports</h1>
  <p class="date">{{RANGE}}</p>
  <p class="summary">{{OVERALL}}</p>

  <!-- REPEAT per day, newest first. The whole card links to that day's page. -->
  <a class="card" href="{{DAY_HREF}}">
    <div class="top"><span class="name">{{DAY_LABEL}}</span><span class="when">{{N}} calls</span></div>
    <p class="blurb">{{DAY_BLURB}}</p>
    <ul class="tally">
      <li class="mine">{{N}} yours</li><li class="theirs">{{N}} theirs</li><li class="ask">{{N}} questions</li>
    </ul>
  </a>
</main>
</body>
</html>
